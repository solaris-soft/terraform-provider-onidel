name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Keep release.yml on the same patched toolchain.
          go-version: '1.27.3'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check dependency consistency
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check reachable vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -o terraform-provider-onidel .
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.0'
          terraform_wrapper: false
      - run: terraform fmt -check -recursive examples
      - run: python3 scripts/smoke_test.py
      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: check
